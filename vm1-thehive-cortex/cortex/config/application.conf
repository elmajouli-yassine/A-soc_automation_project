# =============================================================
#  Cortex 4 — application.conf
#  Location on host: ./cortex/config/application.conf
#  Mounted read-only at: /etc/cortex/application.conf
# =============================================================

# SECRET
include "/etc/cortex/secret.conf"

# ── HTTP CONTEXT ─────────────────────────────────────────────
play.http.context = "/cortex"

# ── AUTHENTICATION ───────────────────────────────────────────
# "key" provider enables API key authentication (required for
# TheHive and Shuffle integration)
auth {
  provider = [local, key]
  ad   {}
  ldap {}
}

# ── ANALYZERS ────────────────────────────────────────────────
analyzer {
  urls = [
    "https://download.thehive-project.org/analyzers.json"
    "/opt/cortexneurons/analyzers"
  ]
  fork-join-executor {
    parallelism-min    = 2
    parallelism-factor = 2.0
    parallelism-max    = 4
  }
}

# ── RESPONDERS ───────────────────────────────────────────────
responder {
  urls = [
    "https://download.thehive-project.org/responders.json"
    "/opt/cortexneurons/responders"
  ]
  fork-join-executor {
    parallelism-min    = 2
    parallelism-factor = 2.0
    parallelism-max    = 4
  }
}

# ── JOB DIRECTORY ────────────────────────────────────────────
# Cortex writes job results here; must be writable (chmod 777)
job {
  directory = /tmp/cortex-jobs
}
