# =============================================================
#  Nginx — Reverse Proxy for TheHive + Cortex
#  Place TLS certs in: ./nginx/certs/thehive.crt / thehive.key
# =============================================================

# ── HTTP → HTTPS redirect ────────────────────────────────────
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ── TheHive (HTTPS) ──────────────────────────────────────────
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/thehive.crt;
    ssl_certificate_key /etc/nginx/certs/thehive.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 2G;

    # TheHive
    location /thehive/ {
        proxy_pass         http://thehive:9000/thehive/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    # Cortex
    location /cortex/ {
        proxy_pass         http://cortex:9001/cortex/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }
}
