# =============================================================
#  TheHive 5 — application.conf
#  Location on host: ./thehive/config/application.conf
#  Mounted read-only at: /etc/thehive/application.conf
# =============================================================

# SECRET (auto-generated on first run or set manually)
include "/etc/thehive/secret.conf"

# ── DATABASE (Cassandra via JanusGraph) ──────────────────────
db.janusgraph.storage {
  backend  = cql
  hostname = ["cassandra"]
  cql {
    cluster-name = thp
    keyspace     = thehive
  }
}

# ── INDEX (Elasticsearch) ────────────────────────────────────
include "/etc/thehive/index.conf"

# ── FILE STORAGE ─────────────────────────────────────────────
storage {
  provider: localfs
  localfs {
    location: /opt/thp/thehive/files
  }
}

# ── HTTP / CONTEXT ───────────────────────────────────────────
play.http.context              : "/thehive"
play.http.parser.maxDiskBuffer : 1GB
play.http.parser.maxMemoryBuffer: 256kB

stream.longPolling.refresh: 45 seconds

stream {
  get {
    maxAttempts  = 5
    minBackoff   = 100 milliseconds
    maxBackoff   = 500 milliseconds
    randomFactor = 0.2
  }
}

# ── CONNECTORS ───────────────────────────────────────────────
scalligraph.modules += org.thp.thehive.connector.cortex.CortexModule
scalligraph.modules += org.thp.thehive.connector.misp.MispModule

# ── CORTEX INTEGRATION ───────────────────────────────────────
# Uses Docker internal DNS — container name "cortex"
cortex {
  servers = [
    {
      name = "Cortex"
      url  = "http://cortex:9001/cortex"
      auth {
        type = "bearer"
        key  = ${?CORTEX_API_KEY}     # injected from .env
      }
      wsConfig {}
    }
  ]
}
