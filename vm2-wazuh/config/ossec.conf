<!--
  =============================================================
   Wazuh ossec.conf — localfile block for ML-SOC predictions
   Add this block inside <ossec_config> in your ossec.conf
   File: /var/ossec/etc/ossec.conf
  =============================================================
-->

<ossec_config>

  <!-- ── ML-SOC log file monitoring ────────────────────────── -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/ml-soc/predictions.log</location>
  </localfile>

  <!-- ── Shuffle SOAR integration (webhook) ────────────────── -->
  <!-- Triggers on ML-SOC rules (100200–100601 = level >= 8)   -->
  <integration>
    <name>shuffle</name>
    <hook_url>http://SHUFFLE_VM_IP:5001/api/v1/hooks/YOUR_WEBHOOK_ID</hook_url>
    <rule_id>100200,100201,100300,100301,100400,100401,100500,100501,100600,100601</rule_id>
    <alert_format>json</alert_format>
  </integration>

</ossec_config>
