version: "3.8"

# =============================================================
#  VM3 — Shuffle SOAR Stack
#  A-SOC Project — ENSAM Casablanca
#
#  IMPORTANT: Set SHUFFLE_SWARM_CONFIG=false (not "run")
#             to prevent Docker Swarm attachment errors.
#
#  Usage:
#    cp .env.example .env && nano .env
#    docker compose up -d
# =============================================================

services:

  # ── Shuffle Frontend (React UI) ───────────────────────────
  shuffle-frontend:
    image: ghcr.io/shuffle/shuffle-frontend:latest
    container_name: shuffle-frontend
    restart: unless-stopped
    ports:
      - "3001:80"
      - "3443:443"
    environment:
      - BACKEND_HOSTNAME=${OUTER_HOSTNAME}
    networks:
      - shuffle

  # ── Shuffle Backend (Go API) ──────────────────────────────
  shuffle-backend:
    image: ghcr.io/shuffle/shuffle-backend:latest
    container_name: shuffle-backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    volumes:
      - shuffle_files:/etc/shuffle
      - /var/run/docker.sock:/var/run/docker.sock  # required for app containers
    environment:
      - SHUFFLE_OPENSEARCH_URL=https://shuffle-opensearch:9200
      - SHUFFLE_OPENSEARCH_USERNAME=admin
      - SHUFFLE_OPENSEARCH_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
      - SHUFFLE_OPENSEARCH_SKIPSSL_VERIFY=true
      - OUTER_HOSTNAME=${OUTER_HOSTNAME}
      - SHUFFLE_DEFAULT_USERNAME=${SHUFFLE_DEFAULT_USERNAME}
      - SHUFFLE_DEFAULT_PASSWORD=${SHUFFLE_DEFAULT_PASSWORD}
      - SHUFFLE_ENCRYPTION_MODIFIER=${SHUFFLE_ENCRYPTION_MODIFIER}
    networks:
      - shuffle
    depends_on:
      - shuffle-opensearch

  # ── Shuffle Orborus (workflow executor) ───────────────────
  shuffle-orborus:
    image: ghcr.io/shuffle/shuffle-orborus:latest
    container_name: shuffle-orborus
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - ENVIRONMENT_NAME=Shuffle
      - BASE_URL=http://${OUTER_HOSTNAME}:5001
      - DOCKER_API_VERSION=1.40
      - SHUFFLE_SWARM_CONFIG=false     # ← CRITICAL: must be false
      - CLEANUP=false
      - SHUFFLE_OPENSEARCH_URL=https://shuffle-opensearch:9200
      - SHUFFLE_OPENSEARCH_USERNAME=admin
      - SHUFFLE_OPENSEARCH_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    networks:
      - shuffle
    depends_on:
      - shuffle-backend

  # ── OpenSearch (Shuffle database) ─────────────────────────
  shuffle-opensearch:
    image: opensearchproject/opensearch:2.14.0
    container_name: shuffle-opensearch
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - shuffle

volumes:
  shuffle_files:
  opensearch_data:

networks:
  shuffle:
    driver: bridge
